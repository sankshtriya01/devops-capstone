# Configuration management: the same settings on every server, every time.
- name: Configure servers
  hosts: devops_servers
  become: true
  tasks:
    - name: Create a dedicated user for the application
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Create the configuration folder
      ansible.builtin.file:
        path: "{{ app_config_dir }}"
        state: directory
        owner: "{{ app_user }}"
        mode: "0750"

    - name: Write the application settings file from a template
      ansible.builtin.template:
        src: ../templates/app.env.j2
        dest: "{{ app_config_dir }}/app.env"
        owner: "{{ app_user }}"
        mode: "0640"

    - name: Allow more memory mappings (needed by Elasticsearch and SonarQube)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-devops-lab.conf
        content: "vm.max_map_count=262144\n"
        mode: "0644"
      notify: Reload sysctl

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
