# Security: block all traffic by default, then allow only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tasktracker
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-traffic
  namespace: tasktracker
spec:
  podSelector:
    matchLabels:
      app: tasktracker
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
