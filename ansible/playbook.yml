# Prepares a fresh Ubuntu server with everything needed to run the platform.
# Run:  ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
- name: Set up DevOps tooling server
  hosts: devops_servers
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [curl, git, ca-certificates, docker.io, python3-pip]
        state: present
        update_cache: true

    - name: Make sure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the login user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Install kubectl
      ansible.builtin.get_url:
        url: https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Install minikube
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: Install Terraform
      ansible.builtin.unarchive:
        src: https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        creates: /usr/local/bin/terraform

    - name: Install Helm
      ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
