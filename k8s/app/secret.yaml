# Kubernetes Secret: database password and the key used to sign login cookies.
# LAB VALUES ONLY. In production never commit real secrets to Git; use Sealed Secrets,
# External Secrets or a cloud secret manager. The same password is used in the DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: tasktracker-secrets
  namespace: tasktracker
type: Opaque
stringData:
  POSTGRES_DB: tasktracker
  POSTGRES_USER: tasktracker
  POSTGRES_PASSWORD: lab-db-password-1
  DATABASE_URL: postgresql://tasktracker:lab-db-password-1@postgres:5432/tasktracker
  SECRET_KEY: lab-session-signing-key-change-me
